version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: dashboard:latest
    container_name: dashboard
    restart: always
    ports:
      - "8051:8051"
    volumes:
      - /data/shapefiles:/workspaces/AUTOMATIZACION_DASH/PRUEBA/DATA
      - /data/usuarios:/workspaces/AUTOMATIZACION_DASH/PRUEBA/USUARIOS
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - dashboard-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - dashboard
    networks:
      - dashboard-network

networks:
  dashboard-network:
    driver: bridge
